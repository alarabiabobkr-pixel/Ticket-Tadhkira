name: Telegram HLS Catalog Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'وضع الرفع: fast-then-full (السريع تلقائياً ثم الضغط) أو fast-only أو smart-720p'
        required: true
        default: 'fast-then-full'
        type: choice
        options:
          - fast-then-full
          - fast-only
          - smart-720p
      only:
        description: 'المحتوى المطلوب: all (أفلام + مسلسلات) أو movies (أفلام فقط)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - movies
      minutes:
        description: 'مدة التشغيل بالدقائق لكل قناة في الدورة الواحدة'
        required: true
        default: '45'
        type: choice
        options:
          - '25'
          - '35'
          - '45'
          - '50'
  schedule:
    # تشغيل تلقائي كل ساعة بالتوازي على القنوات لإنهاء المكتبة بالكامل بسرعة وأمان
    - cron: '5 * * * *'

concurrency:
  group: telegram-catalog-migrator
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 56
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: movies-default
            keys: movies_default
          - name: series-arabic
            keys: series_arabic
          - name: series-turkish-yemeni
            keys: series_turkish,series_yemeni
          - name: anime-all
            keys: anime_movies,series_anime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Telegram Bot Secret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ Error: TELEGRAM_BOT_TOKEN secret is missing!"
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Run Channel Migration Batch (${{ matrix.group.name }})
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'fast-then-full' }}
          ONLY_SCOPE: ${{ github.event.inputs.only || 'all' }}
          MAX_MINUTES: ${{ github.event.inputs.minutes || '45' }}
          CHANNEL_KEYS: ${{ matrix.group.keys }}
        run: |
          START_TS=$(date +%s)
          if [ "$MODE" = "smart-720p" ]; then
            node scripts/batch_migrate_catalog.mjs --only="$ONLY_SCOPE" --channel-key="$CHANNEL_KEYS" --skip-catalog-sync --max-minutes="$MAX_MINUTES" --ffmpeg-workers=2
          elif [ "$MODE" = "fast-only" ]; then
            node scripts/batch_migrate_catalog.mjs --only="$ONLY_SCOPE" --channel-key="$CHANNEL_KEYS" --skip-catalog-sync --fast-only --max-minutes="$MAX_MINUTES"
          else
            node scripts/batch_migrate_catalog.mjs --only="$ONLY_SCOPE" --channel-key="$CHANNEL_KEYS" --skip-catalog-sync --fast-only --max-minutes="$MAX_MINUTES"
            NOW_TS=$(date +%s)
            ELAPSED_MIN=$(( (NOW_TS - START_TS) / 60 ))
            REMAINING_MIN=$(( MAX_MINUTES - ELAPSED_MIN ))
            if [ "$REMAINING_MIN" -ge 3 ]; then
              echo "Fast-only finished with ${REMAINING_MIN}m left. Continuing with Smart 720p batch..."
              node scripts/batch_migrate_catalog.mjs --only="$ONLY_SCOPE" --channel-key="$CHANNEL_KEYS" --skip-catalog-sync --max-minutes="$REMAINING_MIN" --ffmpeg-workers=2
            fi
          fi

          rm -f public/tg_hls/*.tmp.*

      - name: Commit and Push Channel Manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tg_hls/*.json
          if git diff --cached --quiet; then
            echo "ℹ️ No manifest changes for ${{ matrix.group.name }}."
            exit 0
          fi
          git commit -m "chore(telegram): sync ${{ matrix.group.name }} manifests"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "✅ Pushed ${{ matrix.group.name }} manifests."
              exit 0
            fi
            sleep $((2 + RANDOM % 5))
          done
          echo "❌ Failed to push after 6 attempts"
          exit 1

  sync-catalog:
    needs: migrate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Backfill Thumbnails & Sync Catalog JSON
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node scripts/backfill_tg_thumbnails.mjs --max-minutes=5 --workers=2 || true
          node scripts/batch_migrate_catalog.mjs --sync-only
          rm -f public/tg_hls/*.tmp.*

      - name: Push Updated Catalog & Thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tg_hls public/catalog.json public/curated_catalog.json public/catalog.js
          if git diff --cached --quiet; then
            echo "ℹ️ Catalog already up to date."
            exit 0
          fi
          git commit -m "chore(telegram): sync catalog & thumbnails"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "✅ Catalog and thumbnails synced to GitHub."
